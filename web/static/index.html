<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-mesh — explorador del grafo</title>
<script src="/static/cytoscape.min.js"></script>
<script src="/static/layout-base.js"></script>
<script src="/static/cose-base.js"></script>
<script src="/static/cytoscape-fcose.js"></script>
<style>
  :root{
    --bg:#0d1117; --panel:#151b24; --panel2:#1b2430; --line:#243040;
    --text:#e6edf3; --dim:#8b98a8; --accent:#4ea1ff; --ok:#3fb950; --bad:#f85149;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;overflow:hidden}

  header{display:flex;align-items:center;gap:14px;padding:10px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  header h1 span{color:var(--accent)}
  .pill{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--panel2);
    border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .pill.ok{color:var(--ok);border-color:#1c3d26}
  .pill.bad{color:var(--bad);border-color:#4a2020}

  main{flex:1;display:flex;min-height:0}

  aside{width:390px;flex:0 0 390px;display:flex;flex-direction:column;
    background:var(--panel);border-right:1px solid var(--line);min-height:0}

  .searchbox{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .searchrow{display:flex;gap:8px}
  input[type=search],select,button{font:inherit;color:var(--text);background:var(--panel2);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
  input[type=search]{flex:1;min-width:0}
  input[type=search]:focus,select:focus{border-color:var(--accent)}
  button{cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:#1a4d80;border-color:#2a6aa8}
  button.primary:hover{background:#1f5c99}
  button:disabled{opacity:.5;cursor:not-allowed}
  .opts{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim)}
  .opts label{display:flex;align-items:center;gap:5px}

  .results{flex:1;overflow-y:auto;padding:8px}
  .empty{color:var(--dim);font-size:13px;padding:24px 14px;text-align:center;line-height:1.6}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:.12s}
  .card:hover{border-color:#33507a;transform:translateX(2px)}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px #1a4d80 inset}
  .card .top{display:flex;gap:8px;align-items:baseline;margin-bottom:3px}
  .card .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .sc{font-size:11px;color:var(--dim);margin-left:auto;flex:0 0 auto}
  .card .txt{font-size:12px;color:var(--dim);max-height:3.1em;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .lab{font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:2px 6px;
    border-radius:5px;background:#22303f;color:#9db4cc;flex:0 0 auto}

  .graphwrap{flex:1;position:relative;min-width:0;background:
    radial-gradient(circle at 30% 20%,#141c26 0,#0d1117 70%)}
  #cy{position:absolute;inset:0}
  .toolbar{position:absolute;top:12px;left:12px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;
    align-items:center;max-width:calc(100% - 380px)}
  .toolbar button,.toolbar select{padding:6px 10px;font-size:12px;
    background:rgba(21,27,36,.94);backdrop-filter:blur(6px)}
  .toolbar select{padding:5px 6px}
  .legend{position:absolute;bottom:12px;left:12px;z-index:5;display:flex;gap:10px;
    flex-wrap:wrap;font-size:11px;color:var(--dim);background:rgba(21,27,36,.85);
    padding:7px 10px;border-radius:8px;border:1px solid var(--line);max-width:60%}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

  .detail{position:absolute;top:12px;right:12px;width:340px;max-height:calc(100% - 24px);
    z-index:6;background:rgba(21,27,36,.97);border:1px solid var(--line);border-radius:12px;
    padding:14px;overflow-y:auto;display:none;backdrop-filter:blur(8px)}
  .detail.on{display:block}
  .detail h2{font-size:14px;margin:6px 0 2px;line-height:1.3;padding-right:22px}
  .detail .meta{font-size:11px;color:var(--dim);margin-bottom:10px}
  .detail pre{white-space:pre-wrap;word-break:break-word;font:11.5px/1.5 ui-monospace,monospace;
    color:#c3d0dd;background:#0f151d;padding:9px;border-radius:8px;max-height:240px;overflow:auto}
  .detail .close{position:absolute;top:9px;right:9px;padding:2px 8px;font-size:13px}
  .detail .rels{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 10px}
  .detail .rels span{font-size:10.5px;padding:2px 7px;border-radius:999px;
    background:#1d3326;color:#7fd08f;border:1px solid #21402c}
  .detail .relrow{display:flex;gap:6px;align-items:baseline;font-size:11.5px;
    padding:3px 0;border-bottom:1px solid #1d2733;cursor:pointer}
  .detail .relrow:hover{color:#fff}
  .detail .dir{color:#4ea1ff;font-family:ui-monospace,monospace;flex:0 0 auto}

  .loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(13,17,23,.55);z-index:9;font-size:13px;color:var(--dim)}
  .loading.on{display:flex}
  .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp .7s linear infinite;margin-right:9px}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media (max-width:820px){
    main{flex-direction:column}
    aside{width:100%;flex:0 0 44%;border-right:none;border-bottom:1px solid var(--line)}
    .detail{width:calc(100% - 24px)}
    .toolbar{max-width:calc(100% - 24px)}
  }
</style>
</head>
<body>

<header>
  <h1>agent-mesh <span>· explorador del grafo</span></h1>
  <span class="pill" id="health">conectando…</span>
  <div style="flex:1"></div>
  <span class="pill" id="counter">0 nodos · 0 aristas</span>
</header>

<main>
  <aside>
    <div class="searchbox">
      <div class="searchrow">
        <input id="q" type="search" placeholder="Busca: hermes-listener, dreamfyre, glico…" autocomplete="off">
        <button id="go" class="primary">Buscar</button>
      </div>
      <div class="opts">
        <label><input type="radio" name="mode" value="semantic" checked> semántica</label>
        <label><input type="radio" name="mode" value="fts"> texto</label>
        <span style="margin-left:auto"></span>
        <label>top
          <select id="limit">
            <option>8</option><option selected>12</option><option>20</option><option>40</option>
          </select>
        </label>
      </div>
      <div class="searchrow">
        <button id="plot" style="flex:1" disabled>Graficar resultados</button>
        <button id="clear" title="Limpiar grafo">Limpiar</button>
      </div>
    </div>
    <div class="results" id="results">
      <div class="empty">Busca en el grafo compartido.<br>
        Haz clic en un resultado para dibujarlo y expandir sus vecinos.</div>
    </div>
  </aside>

  <section class="graphwrap">
    <div id="cy"></div>
    <div class="toolbar">
      <button id="fit" title="Ajustar vista">Ajustar</button>
      <button id="relayout" title="Recalcular toda la disposición">Reordenar</button>
      <select id="layoutSel" title="Tipo de disposición">
        <option value="fcose" selected>fuerza</option>
        <option value="concentric">concéntrico</option>
        <option value="breadthfirst">jerárquico</option>
        <option value="circle">círculo</option>
        <option value="grid">cuadrícula</option>
      </select>
      <button id="hopsBtn" title="Profundidad al expandir">vecinos: 1 salto</button>
      <button id="labelsBtn" title="Mostrar los tipos de relación">relaciones: off</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="detail" id="detail">
      <button class="close" id="dclose">✕</button>
      <div id="dbody"></div>
    </div>
    <div class="loading" id="loading"><div class="spin"></div>consultando la KB…</div>
  </section>
</main>

<script>
const COLORS = {
  Agente:"#4ea1ff", Infra:"#f0883e", Servicio:"#3fb950", Memoria:"#a371f7",
  Persona:"#f778ba", Preferencia:"#d29922", Skill:"#39c5cf", Spec:"#8957e5",
  Blog:"#e3b341", PropuestaBlog:"#bf8700", default:"#7d8590"
};
const LABELS = ["Agente","Infra","Servicio","Memoria","Persona","Preferencia","Skill","Spec","Blog","PropuestaBlog"];
const HAS_FCOSE = typeof window.cytoscapeFcose !== "undefined";

const $ = id => document.getElementById(id);
const state = { hops:1, results:[], labels:false };

const cy = cytoscape({
  container: $("cy"),
  wheelSensitivity: 0.2,
  minZoom: 0.05, maxZoom: 3,
  boxSelectionEnabled: false,
  style: [
    { selector:"node", style:{
        "background-color":"data(color)",
        "label":"data(shortName)",
        "color":"#cdd9e5","font-size":10,"text-valign":"bottom","text-margin-y":5,
        "text-outline-width":2,"text-outline-color":"#0d1117",
        "text-wrap":"ellipsis","text-max-width":"88px","min-zoomed-font-size":7,
        "width":"data(size)","height":"data(size)",
        "border-width":1.5,"border-color":"#0d1117"
    }},
    { selector:"node.hub", style:{"border-width":2.5,"border-color":"#4a6580"} },
    { selector:"node.root", style:{"border-width":3,"border-color":"#4ea1ff"} },
    { selector:"node:selected", style:{"border-width":3,"border-color":"#ffffff"} },
    { selector:"edge", style:{
        "width":1.1,"line-color":"#2f3f52","target-arrow-color":"#2f3f52",
        "target-arrow-shape":"triangle","curve-style":"bezier",
        "arrow-scale":.65,"opacity":.75
    }},
    { selector:"edge[?bidirectional]", style:{"source-arrow-shape":"triangle",
        "source-arrow-color":"#2f3f52"} },
    { selector:"edge[?multi]", style:{"width":1.8,"line-color":"#3c5069",
        "target-arrow-color":"#3c5069"} },
    { selector:"edge[label]", style:{
        "label":"data(label)","font-size":8,"color":"#8595a8",
        "text-rotation":"autorotate","text-margin-y":-6,
        "text-opacity":0,"min-zoomed-font-size":11,
        "text-outline-width":2,"text-outline-color":"#0d1117",
        "text-background-color":"#0d1117","text-background-opacity":0.75,
        "text-background-padding":2}},
    { selector:"edge.showlabels", style:{"text-opacity":0.95} },
    { selector:"edge:selected", style:{"line-color":"#4ea1ff",
        "target-arrow-color":"#4ea1ff","source-arrow-color":"#4ea1ff","width":2.4,"opacity":1} },
    { selector:".dim", style:{"opacity":0.12}},
    { selector:"node.dim", style:{"text-opacity":0.05}}
  ],
  layout: { name:"preset" }
});

/* ── utilidades ────────────────────────────────────────── */
function setLoading(on){ $("loading").classList.toggle("on", on); }
function colorOf(label){ return COLORS[label] || COLORS.default; }
function short(name, n=24){
  name = (name||"").replace(/\s+/g," ").trim();
  return name.length > n ? name.slice(0,n-1)+"…" : name;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function updateCounter(){
  const n = cy.nodes().length, e = cy.edges().length;
  const base = $("counter").dataset.base || "";
  $("counter").textContent = `${n} nodos · ${e} aristas` + (base ? ` · ${base}` : "");
}

/* ── salud ─────────────────────────────────────────────── */
async function loadHealth(){
  const el = $("health");
  try{
    const d = await (await fetch("/api/health")).json();
    if (d.status === "ok"){
      el.className = "pill ok"; el.textContent = "KB online";
      $("counter").dataset.base = `${d.nodes ?? "?"} en la KB`;
    } else { el.className = "pill bad"; el.textContent = "KB caída"; }
  }catch(e){ el.className = "pill bad"; el.textContent = "sin conexión"; }
  updateCounter();
}
loadHealth(); setInterval(loadHealth, 60000);

/* ── búsqueda ──────────────────────────────────────────── */
async function doSearch(){
  const q = $("q").value.trim();
  if(!q) return;
  const mode = document.querySelector('input[name=mode]:checked').value;
  const limit = $("limit").value;
  setLoading(true);
  try{
    const r = await fetch(`/api/search?q=${encodeURIComponent(q)}&mode=${mode}&limit=${limit}`);
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail || "error");
    state.results = d.results || [];
    renderResults();
  }catch(e){
    $("results").innerHTML = `<div class="empty">Error: ${escapeHtml(e.message)}</div>`;
    $("plot").disabled = true;
  }finally{ setLoading(false); }
}

function renderResults(){
  const box = $("results");
  $("plot").disabled = state.results.length === 0;
  if(!state.results.length){
    box.innerHTML = `<div class="empty">Sin resultados.<br>Prueba otra formulación o cambia a búsqueda por texto.</div>`;
    return;
  }
  box.innerHTML = state.results.map((n,i)=>{
    const s = n.score ?? n.rank;
    const sc = (s === undefined || s === null) ? "" : Number(s).toFixed(2);
    return `<div class="card" data-i="${i}">
      <div class="top">
        <span class="lab" style="color:${colorOf(n.label)}">${escapeHtml(n.label||"")}</span>
        <span class="nm" title="${escapeHtml(n.name||"")}">${escapeHtml(n.name||"")}</span>
        <span class="sc">${sc}</span>
      </div>
      <div class="txt">${escapeHtml((n.text||"").slice(0,220))}</div>
    </div>`;
  }).join("");

  box.querySelectorAll(".card").forEach(c=>{
    c.addEventListener("click", ()=>{
      const n = state.results[+c.dataset.i];
      const node = addNode(n, true);
      showDetail(n);
      box.querySelectorAll(".card").forEach(x=>x.classList.remove("sel"));
      c.classList.add("sel");
      // colocar el nodo en el centro de la vista si es nuevo
      if(cy.nodes().length === 1) cy.center(node);
      expand(n.id);
    });
  });
}

/* ── grafo: nodos y aristas ────────────────────────────── */
function addNode(n, isRoot){
  const id = String(n.id);
  const existing = cy.getElementById(id);
  if(existing.length){
    if(isRoot) existing.addClass("root");
    return existing;
  }
  const node = cy.add({
    data:{
      id, name:n.name||("nodo "+n.id),
      shortName: short(n.name||("nodo "+n.id)),
      label:n.label||"", color: colorOf(n.label),
      size: isRoot ? 26 : 18,
      text:n.text||"", props:n.properties||{}
    },
    classes: isRoot ? "root" : ""
  });
  if(!isRoot && node.degree() > 6) node.addClass("hub");
  node.scratch({ fresh:true });
  return node;
}

/* Una sola arista por par de nodos. Los tipos se acumulan en la etiqueta.
   Antes se creaban 4 aristas superpuestas entre el mismo par y eso era
   justo lo que emborronaba el centro del mapa. */
function pairKey(a,b){ return a < b ? a+"|"+b : b+"|"+a; }

function addEdge(src, tgt, type){
  const a = String(src), b = String(tgt);
  if(a === b) return;
  if(!cy.getElementById(a).length || !cy.getElementById(b).length) return;

  const id = "e:" + pairKey(a,b);
  const found = cy.getElementById(id);

  if(found.length){
    const e = found;
    const types = e.data("types") || [];
    if(!types.includes(type)){
      types.push(type);
      e.data({
        types,
        label: types.join(" · "),
        multi: types.length > 1
      });
    }
    if(e.data("source") !== a) e.data("bidirectional", true);
    return;
  }

  cy.add({ data:{
    id, source:a, target:b, type, types:[type], label:type,
    multi:false, bidirectional:false
  }});
}

/* ── expansión ─────────────────────────────────────────── */
async function expand(nodeId){
  setLoading(true);
  const before = new Set(cy.nodes().map(n=>n.id()));
  try{
    const r = await fetch(`/api/expand?node=${nodeId}&hops=${state.hops}&limit=60`);
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail||"error");

    (d.neighbors||[]).forEach(nb=>{
      addNode(nb,false);
      (nb.relations||["RELACIONADO_CON"]).forEach(rel => addEdge(nodeId, nb.id, rel));
    });

    const added = cy.nodes().filter(n=>!before.has(n.id()));
    if(added.length){
      placeNear(nodeId, added);
      refineLayout(added.length < 25);
    }
    updateCounter();
  }catch(e){ console.warn(e); }
  finally{ setLoading(false); }
}

/* Coloca los nodos nuevos en anillos alrededor del padre para que el mapa
   no dé un salto cada vez que expandes. */
function placeNear(parentId, nodes){
  const p = cy.getElementById(String(parentId));
  if(!p.length) return;
  const base = p.position();
  const count = nodes.length;
  const ring = 130 + Math.min(count, 12) * 6;
  nodes.forEach((n,i)=>{
    const ang = (2*Math.PI*i)/count - Math.PI/2;
    const r = ring + (i % 2 ? 34 : 0);
    n.position({ x: base.x + Math.cos(ang)*r, y: base.y + Math.sin(ang)*r });
  });
}

/* ── disposición ───────────────────────────────────────── */
function layoutOptions(name, randomize){
  const n = cy.nodes().length;
  const dense = n > 120;
  switch(name){
    case "fcose":
      if(HAS_FCOSE) return {
        name:"fcose",
        quality: n > 400 ? "draft" : (n > 150 ? "default" : "proof"),
        randomize, animate:true, animationDuration:650, animationEasing:"ease-out",
        fit:true, padding:60,
        nodeSeparation: dense ? 120 : 90,
        nodeRepulsion: dense ? 16000 : 10000,
        idealEdgeLength: dense ? 150 : 110,
        edgeElasticity: 0.4,
        nestingFactor: 0.1,
        gravity: dense ? 0.18 : 0.12,
        numIter: dense ? 1200 : 2500,
        initialTemp: 220, coolingFactor: 0.95, minTemp: 1.0,
        samplingType:true, sampleSize: 30,
        packComponents:true, tile:true,
        nodeDimensionsIncludeLabels:true,
        uniformNodeDimensions:false
      };
      return layoutOptions("cose", randomize);
    case "cose":
      return { name:"cose", randomize, animate:true, animationDuration:650,
        nodeRepulsion: dense?18000:12000, idealEdgeLength: dense?160:120,
        edgeElasticity:200, gravity: dense?0.5:0.25, numIter:2000,
        nodeOverlap:20, fit:true, padding:60, componentSpacing:120 };
    case "concentric":
      return { name:"concentric", fit:true, padding:60, animate:true,
        animationDuration:600, minNodeSpacing: dense?45:70, avoidOverlap:true,
        concentric: n => n.degree(),
        levelWidth: () => n.count() > 40 ? 2 : 3 };
    case "breadthfirst":
      return { name:"breadthfirst", directed:true, fit:true, padding:60,
        animate:true, animationDuration:600, spacingFactor:1.35, avoidOverlap:true,
        grid:true, circle:false };
    case "circle":
      return { name:"circle", fit:true, padding:60, animate:true, spacingFactor:1.5 };
    case "grid":
      return { name:"grid", fit:true, padding:60, animate:true, avoidOverlap:true };
    default:
      return { name:"preset" };
  }
}

/* Construye el layout con red de seguridad: si el plugin no está registrado
   de verdad (no basta con que window.cytoscapeFcose exista), cae a cose. */
function safeLayout(opts, fallback){
  try{
    return cy.layout(opts);
  }catch(e){
    console.warn(`layout "${opts.name}" no disponible (${e.message}); uso ${fallback||"cose"}`);
    return cy.layout(layoutOptions(fallback || "cose", true));
  }
}

function runLayout(name){
  const sel = name || $("layoutSel").value;
  const l = safeLayout(layoutOptions(sel, true), "cose");
  l.one("layoutstop", updateCounter);
  l.run();
}

/* Repaso suave tras expandir: mantiene las posiciones y solo desenreda. */
function refineLayout(animate){
  if(cy.nodes().length < 3) return;
  if(!HAS_FCOSE){ cy.layout(layoutOptions("cose", false)).run(); return; }
  const opts = layoutOptions("fcose", false);
  opts.animate = !!animate;
  opts.animationDuration = 500;
  opts.numIter = 800;
  opts.fit = true;
  opts.padding = 70;
  safeLayout(opts, "cose").run();
}

/* ── graficar resultados ───────────────────────────────── */
async function plotResults(){
  if(!state.results.length) return;
  const ids = state.results.map(n=>n.id).join(",");
  setLoading(true);
  try{
    const r = await fetch(`/api/subgraph?nodes=${ids}&hops=1&limit=22`);
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail||"error");
    cy.elements().remove();
    state.results.forEach(n=> addNode(n,true));
    (d.nodes||[]).forEach(nb=> addNode(nb,false));
    (d.edges||[]).forEach(e=> addEdge(e.source, e.target, e.type));
    runLayout();
  }catch(e){
    $("results").insertAdjacentHTML("afterbegin",
      `<div class="empty">No se pudo graficar: ${escapeHtml(e.message)}</div>`);
  }finally{ setLoading(false); }
}

/* ── detalle ───────────────────────────────────────────── */
function showDetail(n){
  const id = String(n.id);
  const node = cy.getElementById(id);
  const types = node.length
    ? [...new Set(node.connectedEdges().map(e=>e.data("type")).filter(Boolean))]
    : [];

  $("dbody").innerHTML = `
    <span class="lab" style="color:${colorOf(n.label)}">${escapeHtml(n.label||"")}</span>
    <h2>${escapeHtml(n.name||"")}</h2>
    <div class="meta">id ${id}${n.score!==undefined && n.score!==null
      ? ` · similitud ${Number(n.score).toFixed(3)}` : ""}</div>
    ${types.length ? `<div class="rels">${types.map(r=>`<span>${escapeHtml(r)}</span>`).join("")}</div>` : ""}
    ${Array.isArray(n.relations) && n.relations.length ? `
      <div class="meta">relaciones (${n.relations.length})</div>
      <div id="drels">${n.relations.map(r=>`
        <div class="relrow" data-go="${r.id}">
          <span class="dir">${r.direction === "out" ? "→" : "←"}</span>
          <span style="color:#8fb3d9">${escapeHtml(r.type)}</span>
          <span style="color:#8896a6">${escapeHtml(r.label||"")}</span>
          <span>${escapeHtml(r.name||"")}</span>
        </div>`).join("")}</div>` : ""}
    <div class="meta" style="margin-top:10px">texto</div>
    <pre>${escapeHtml((n.text||"(sin texto)").slice(0,4000))}</pre>
    ${n.properties && Object.keys(n.properties).length
      ? `<div class="meta">propiedades</div>
         <pre>${escapeHtml(JSON.stringify(n.properties,null,2).slice(0,1500))}</pre>` : ""}
    <div style="display:flex;gap:8px;margin-top:12px">
      <button id="dexp" style="flex:1;font-size:12px">Expandir vecinos</button>
    </div>`;

  $("detail").classList.add("on");
  $("dexp").onclick = ()=> expand(id);
  $("dbody").querySelectorAll(".relrow").forEach(row=>{
    row.onclick = ()=>{
      const go = row.dataset.go;
      const target = cy.getElementById(go);
      if(target.length){
        cy.elements().removeClass("dim");
        target.addClass("dim").removeClass("dim");
        cy.animate({ center:{ eles: target }, zoom: Math.max(cy.zoom(), 0.9) }, { duration:350 });
        target.select();
        fetchNode(go);
      }
    };
  });
}

async function fetchNode(id){
  setLoading(true);
  try{
    const r = await fetch(`/api/node?id=${encodeURIComponent(id)}`);
    if(!r.ok) throw new Error("no encontrado");
    const n = await r.json();
    showDetail(n);
  }catch(e){ console.warn(e); }
  finally{ setLoading(false); }
}

/* ── eventos ───────────────────────────────────────────── */
$("go").onclick = doSearch;
$("q").addEventListener("keydown", e=>{ if(e.key==="Enter") doSearch(); });
$("plot").onclick = plotResults;
$("clear").onclick = ()=>{ cy.elements().remove(); $("detail").classList.remove("on"); updateCounter(); };
$("fit").onclick = ()=> cy.animate({ fit:{ eles: cy.elements(), padding:70 } }, { duration:400 });
$("relayout").onclick = ()=> runLayout();
$("layoutSel").onchange = ()=> runLayout();
$("dclose").onclick = ()=> $("detail").classList.remove("on");

$("hopsBtn").onclick = ()=>{
  state.hops = state.hops >= 3 ? 1 : state.hops + 1;
  $("hopsBtn").textContent = `vecinos: ${state.hops} salto${state.hops>1?"s":""}`;
};

$("labelsBtn").onclick = ()=>{
  state.labels = !state.labels;
  cy.edges().toggleClass("showlabels", state.labels);
  $("labelsBtn").textContent = `relaciones: ${state.labels ? "on" : "off"}`;
};

/* resaltar vecindario al pasar el ratón: la mejor forma de leer un grafo denso */
let hoverTimer = null;
cy.on("mouseover", "node", evt=>{
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(()=>{
    const el = evt.target;
    const keep = el.closedNeighborhood();
    cy.elements().addClass("dim");
    keep.removeClass("dim");
    el.removeClass("dim");
  }, 60);
});
cy.on("mouseout", "node", ()=>{
  clearTimeout(hoverTimer);
  cy.elements().removeClass("dim");
});

cy.on("tap", "node", evt=>{
  const d = evt.target.data();
  showDetail({ id:Number(d.id), label:d.label, name:d.name,
               text:d.text, properties:d.props });
});

cy.on("dblclick", "node", evt=>{
  expand(evt.target.id());
});

$("legend").innerHTML = LABELS.map(l=>
  `<span><i style="background:${colorOf(l)}"></i>${l}</span>`).join("");

document.addEventListener("keydown", e=>{
  if(e.key === "Escape") $("detail").classList.remove("on");
});

updateCounter();
if(!HAS_FCOSE) console.warn("cytoscape-fcose no cargó; se usará cose");
</script>
</body>
</html>

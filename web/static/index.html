<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-mesh — explorador del grafo</title>
<script src="/static/cytoscape.min.js"></script>
<style>
  :root{
    --bg:#0d1117; --panel:#151b24; --panel2:#1b2430; --line:#243040;
    --text:#e6edf3; --dim:#8b98a8; --accent:#4ea1ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;overflow:hidden}

  header{display:flex;align-items:center;gap:14px;padding:10px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  header h1 span{color:var(--accent)}
  .pill{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--panel2);
    border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .pill.ok{color:var(--ok);border-color:#1c3d26}
  .pill.bad{color:var(--bad);border-color:#4a2020}
  header .spacer{flex:1}

  main{flex:1;display:flex;min-height:0}

  aside{width:390px;flex:0 0 390px;display:flex;flex-direction:column;
    background:var(--panel);border-right:1px solid var(--line);min-height:0}

  .searchbox{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .searchrow{display:flex;gap:8px}
  input[type=search],select,button{font:inherit;color:var(--text);background:var(--panel2);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
  input[type=search]{flex:1;min-width:0}
  input[type=search]:focus,select:focus{border-color:var(--accent)}
  button{cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:#1a4d80;border-color:#2a6aa8}
  button.primary:hover{background:#1f5c99}
  button:disabled{opacity:.5;cursor:not-allowed}
  .opts{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim)}
  .opts label{display:flex;align-items:center;gap:5px}

  .results{flex:1;overflow-y:auto;padding:8px}
  .empty{color:var(--dim);font-size:13px;padding:24px 14px;text-align:center;line-height:1.6}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:.12s}
  .card:hover{border-color:#33507a;transform:translateX(2px)}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px #1a4d80 inset}
  .card .top{display:flex;gap:8px;align-items:baseline;margin-bottom:3px}
  .card .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .sc{font-size:11px;color:var(--dim);margin-left:auto;flex:0 0 auto}
  .card .txt{font-size:12px;color:var(--dim);max-height:3.1em;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .lab{font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:2px 6px;
    border-radius:5px;background:#22303f;color:#9db4cc;flex:0 0 auto}

  .graphwrap{flex:1;position:relative;min-width:0;background:
    radial-gradient(circle at 30% 20%,#141c26 0,#0d1117 70%)}
  #cy{position:absolute;inset:0}
  .toolbar{position:absolute;top:12px;left:12px;z-index:5;display:flex;gap:6px;flex-wrap:wrap}
  .toolbar button{padding:6px 10px;font-size:12px;background:rgba(21,27,36,.92);backdrop-filter:blur(6px)}
  .legend{position:absolute;bottom:12px;left:12px;z-index:5;display:flex;gap:10px;
    flex-wrap:wrap;font-size:11px;color:var(--dim);background:rgba(21,27,36,.85);
    padding:7px 10px;border-radius:8px;border:1px solid var(--line);max-width:60%}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

  .detail{position:absolute;top:12px;right:12px;width:340px;max-height:calc(100% - 24px);
    z-index:6;background:rgba(21,27,36,.97);border:1px solid var(--line);border-radius:12px;
    padding:14px;overflow-y:auto;display:none;backdrop-filter:blur(8px)}
  .detail.on{display:block}
  .detail h2{font-size:14px;margin:6px 0 2px;line-height:1.3}
  .detail .meta{font-size:11px;color:var(--dim);margin-bottom:10px}
  .detail pre{white-space:pre-wrap;word-break:break-word;font:11.5px/1.5 ui-monospace,monospace;
    color:#c3d0dd;background:#0f151d;padding:9px;border-radius:8px;max-height:260px;overflow:auto}
  .detail .close{position:absolute;top:10px;right:10px;padding:2px 8px;font-size:13px}
  .detail .rels{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 10px}
  .detail .rels span{font-size:10.5px;padding:2px 7px;border-radius:999px;
    background:#1d3326;color:#7fd08f;border:1px solid #21402c}

  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(13,17,23,.55);z-index:9;font-size:13px;color:var(--dim);display:none}
  .loading.on{display:flex}
  .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp .7s linear infinite;margin-right:9px}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media (max-width:820px){
    main{flex-direction:column}
    aside{width:100%;flex:0 0 46%;border-right:none;border-bottom:1px solid var(--line)}
    .detail{width:calc(100% - 24px)}
  }
</style>
</head>
<body>

<header>
  <h1>agent-mesh <span>· explorador del grafo</span></h1>
  <span class="pill" id="health">conectando…</span>
  <span class="pad"></span>
  <div style="flex:1"></div>
  <span class="pill" id="counter">0 nodos · 0 aristas</span>
</header>

<main>
  <aside>
    <div class="searchbox">
      <div class="searchrow">
        <input id="q" type="search" placeholder="Busca: hermes-listener, dreamfyre, glico…" autocomplete="off">
        <button id="go" class="primary">Buscar</button>
      </div>
      <div class="opts">
        <label><input type="radio" name="mode" value="semantic" checked> semántica</label>
        <label><input type="radio" name="mode" value="fts"> texto</label>
        <span style="margin-left:auto"></span>
        <label>top
          <select id="limit">
            <option>8</option><option selected>12</option><option>20</option><option>40</option>
          </select>
        </label>
      </div>
      <div class="searchrow">
        <button id="plot" style="flex:1" disabled>Graficar resultados</button>
        <button id="clear" title="Limpiar grafo">Limpiar</button>
      </div>
    </div>
    <div class="results" id="results">
      <div class="empty">Busca en el grafo compartido.<br>
        Haz clic en un resultado para dibujarlo y expandir sus vecinos.</div>
    </div>
  </aside>

  <section class="graphwrap">
    <div id="cy"></div>
    <div class="toolbar">
      <button id="fit" title="Ajustar vista">Ajustar</button>
      <button id="relayout">Reordenar</button>
      <button id="hopsBtn" title="Profundidad al expandir">vecinos: 1 salto</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="detail" id="detail">
      <button class="close" id="dclose">✕</button>
      <div id="dbody"></div>
    </div>
    <div class="loading" id="loading"><div class="spin"></div>consultando la KB…</div>
  </section>
</main>

<script>
const COLORS = {
  Agente:"#4ea1ff", Infra:"#f0883e", Servicio:"#3fb950", Memoria:"#a371f7",
  Persona:"#f778ba", Preferencia:"#d29922", Skill:"#39c5cf", Spec:"#8957e5",
  Blog:"#e3b341", PropuestaBlog:"#bf8700", default:"#7d8590"
};
const LABELS = ["Agente","Infra","Servicio","Memoria","Persona","Preferencia","Skill","Spec","Blog","PropuestaBlog"];

const cy = cytoscape({
  container: document.getElementById("cy"),
  wheelSensitivity: 0.2,
  style: [
    { selector:"node", style:{
        "background-color":"data(color)",
        "label":"data(shortName)",
        "color":"#c8d4e0","font-size":10,"text-valign":"bottom","text-margin-y":5,
        "text-outline-width":2,"text-outline-color":"#0d1117",
        "width":"data(size)","height":"data(size)","border-width":1.5,"border-color":"#0d1117"
    }},
    { selector:"node.root", style:{"border-width":3,"border-color":"#4ea1ff"} },
    { selector:"node:selected", style:{"border-width":3,"border-color":"#ffffff"} },
    { selector:"edge", style:{
        "width":1.2,"line-color":"#2b3a4d","target-arrow-color":"#2b3a4d",
        "target-arrow-shape":"triangle","curve-style":"bezier","arrow-scale":.7,"opacity":.85
    }},
    { selector:"edge[type]", style:{"label":"data(type)","font-size":8,"color":"#5d6b7c",
        "text-rotation":"autorotate","text-margin-y":-6,"text-opacity":0.9}},
    { selector:"edge.hl", style:{"line-color":"#4ea1ff","target-arrow-color":"#4ea1ff","width":2,"opacity":1}}
  ],
  layout: { name:"preset" }
});

let state = { hops:1, results:[], selId:null };
const $ = id => document.getElementById(id);

function setLoading(on){ $("loading").classList.toggle("on", on); }
function colorOf(label){ return COLORS[label] || COLORS.default; }
function short(name, n=26){
  name = (name||"").replace(/\s+/g," ").trim();
  return name.length > n ? name.slice(0,n-1)+"…" : name;
}

/* ── salud ─────────────────────────────────────────────── */
async function loadHealth(){
  const el = $("health");
  try{
    const r = await fetch("/api/health");
    const d = await r.json();
    if (d.status === "ok"){
      el.className = "pill ok";
      el.textContent = "KB online";
      $("counter").textContent = `${d.nodes ?? "?"} nodos · ${d.edges ?? "?"} aristas`;
    } else {
      el.className = "pill bad";
      el.textContent = "KB caída";
      $("counter").textContent = "—";
    }
  }catch(e){
    el.className = "pill bad"; el.textContent = "sin conexión";
  }
}
loadHealth(); setInterval(loadHealth, 60000);

/* ── búsqueda ──────────────────────────────────────────── */
async function doSearch(){
  const q = $("q").value.trim();
  if(!q) return;
  const mode = document.querySelector('input[name=mode]:checked').value;
  const limit = $("limit").value;
  setLoading(true);
  try{
    const r = await fetch(`/api/search?q=${encodeURIComponent(q)}&mode=${mode}&limit=${limit}`);
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail || "error");
    state.results = d.results || [];
    renderResults(d.mode);
  }catch(e){
    $("results").innerHTML = `<div class="empty">Error: ${escapeHtml(e.message)}</div>`;
  }finally{ setLoading(false); }
}

function renderResults(mode){
  const box = $("results");
  $("plot").disabled = state.results.length === 0;
  if(!state.results.length){
    box.innerHTML = `<div class="empty">Sin resultados.<br>Prueba otra formulación o cambia a búsqueda por texto.</div>`;
    return;
  }
  box.innerHTML = state.results.map((n,i)=>{
    const score = (n.score !== undefined && n.score !== null)
      ? n.score : (n.rank !== undefined ? n.rank.toFixed(2) : "");
    return `<div class="card" data-id="${n.id}" data-i="${i}">
      <div class="top">
        <span class="lab" style="color:${colorOf(n.label)}">${escapeHtml(n.label||"")}</span>
        <span class="nm" title="${escapeHtml(n.name||"")}">${escapeHtml(n.name||"")}</span>
        <span class="sc">${score !== "" ? (typeof score==="number"? score.toFixed(2):score) : ""}</span>
      </div>
      <div class="txt">${escapeHtml((n.text||"").slice(0,220))}</div>
    </div>`;
  }).join("");

  box.querySelectorAll(".card").forEach(c=>{
    c.addEventListener("click", ()=> {
      const n = state.results[+c.dataset.i];
      addNode(n, true);
      expand(n.id);
      showDetail(n);
      box.querySelectorAll(".card").forEach(x=>x.classList.remove("sel"));
      c.classList.add("sel");
    });
    c.addEventListener("dblclick", ()=> expandNode(+c.dataset.id));
  });
}

/* ── grafo ─────────────────────────────────────────────── */
function addNode(n, isRoot){
  const id = String(n.id);
  if(cy.getElementById(id).length) {
    if(isRoot) cy.getElementById(id).addClass("root");
    return cy.getElementById(id);
  }
  return cy.add({
    data:{
      id, name:n.name||("nodo "+n.id), shortName: short(n.name||("nodo "+n.id)),
      label:n.label||"", color: colorOf(n.label),
      size: isRoot ? 26 : 18,
      text:n.text||"", props:n.properties||{}
    },
    classes: isRoot ? "root" : ""
  });
}

function addEdge(src, tgt, type){
  const a=String(src), b=String(tgt);
  if(!cy.getElementById(a).length || !cy.getElementById(b).length) return;
  const id = `${a}->${b}:${type}`;
  const rev = `${b}->${a}:${type}`;
  if(cy.getElementById(id).length || cy.getElementById(rev).length) return;
  cy.add({ data:{ id, source:a, target:b, type } });
}

async function expand(nodeId){
  setLoading(true);
  try{
    const r = await fetch(`/api/expand?node=${nodeId}&hops=${state.hops}&limit=60`);
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail||"error");
    (d.neighbors||[]).forEach(nb=>{
      addNode(nb,false);
      (nb.relations||["RELACIONADO_CON"]).forEach(rel=> addEdge(nodeId, nb.id, rel));
    });
    runLayout();
  }catch(e){ console.warn(e); }
  finally{ setLoading(false); }
}

async function plotResults(){
  if(!state.results.length) return;
  const ids = state.results.map(n=>n.id).join(",");
  setLoading(true);
  try{
    const r = await fetch(`/api/subgraph?nodes=${ids}&hops=1&limit=22`);
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail||"error");
    cy.elements().remove();
    state.results.forEach(n=> addNode(n,true));
    (d.nodes||[]).forEach(nb=> addNode(nb,false));
    (d.edges||[]).forEach(e=> addEdge(e.source, e.target, e.type));
    runLayout();
  }catch(e){
    $("results").insertAdjacentHTML("afterbegin",
      `<div class="empty">No se pudo graficar: ${escapeHtml(e.message)}</div>`);
  }finally{ setLoading(false); }
}

function runLayout(){
  const n = cy.nodes().length;
  cy.layout({
    name: n > 60 ? "cose" : "cose",
    animate: n < 200, animationDuration: 600, randomize: true,
    nodeRepulsion: 9000, idealEdgeLength: 110, gravity: 0.25,
    nodeOverlap: 12, numIter: 1200
  }).run();
}

/* ── detalle ───────────────────────────────────────────── */
function showDetail(n){
  state.selId = n.id;
  const node = cy.getElementById(String(n.id));
  let rels = [];
  if(node.length) rels = node.connectedEdges().map(e=>e.data("type"));
  rels = [...new Set(rels)];
  $("dbody").innerHTML = `
    <span class="lab" style="color:${colorOf(n.label)}">${escapeHtml(n.label||"")}</span>
    <h2>${escapeHtml(n.name||"")}</h2>
    <div class="meta">id ${n.id}${n.score!==undefined?` · similitud ${Number(n.score).toFixed(3)}`:""}</div>
    ${rels.length?`<div class="rels">${rels.map(r=>`<span>${escapeHtml(r)}</span>`).join("")}</div>`:""}
    <pre>${escapeHtml((n.text||"(sin texto)").slice(0,4000))}</pre>
    ${n.properties && Object.keys(n.properties).length
      ? `<div class="meta" style="margin-top:10px">propiedades</div>
         <pre>${escapeHtml(JSON.stringify(n.properties,null,2).slice(0,1500))}</pre>` : ""}
    <div style="display:flex;gap:8px;margin-top:12px">
      <button id="dexp" style="flex:1;font-size:12px">Expandir vecinos</button>
    </div>`;
  $("detail").classList.add("on");
  $("dexp").onclick = ()=> expand(n.id);
}

/* ── eventos ───────────────────────────────────────────── */
$("go").onclick = doSearch;
$("q").addEventListener("keydown", e=>{ if(e.key==="Enter") doSearch(); });
$("plot").onclick = plotResults;
$("clear").onclick = ()=>{ cy.elements().remove(); $("detail").classList.remove("on"); };
$("fit").onclick = ()=> cy.fit(cy.elements(), 60);
$("relayout").onclick = runLayout;
$("dclose").onclick = ()=> $("detail").classList.remove("on");
$("hopsBtn").onclick = ()=>{
  state.hops = state.hops >= 2 ? 1 : state.hops + 1;
  $("hopsBtn").textContent = `vecinos: ${state.hops} salto${state.hops>1?"s":""}`;
};

cy.on("tap","node", evt=>{
  const d = evt.target.data();
  showDetail({ id:+d.id, label:d.label, name:d.name, text:d.text, properties:d.props });
  evt.target.connectedEdges().addClass("hl");
  setTimeout(()=> evt.target.connectedEdges().removeClass("hl"), 1400);
});

$("legend").innerHTML = LABELS.map(l=>
  `<span><i style="background:${colorOf(l)}"></i>${l}</span>`).join("");

// arranque: muestra el grafo de los hubs si no hay búsqueda
(function boot(){
  $("q").value = "";
})();

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
</script>
</body>
</html>

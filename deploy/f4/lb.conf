# LB de agent-mesh (F4): primario MateBook, backup Dreamfyre (este host).
# Health check pasivo: 3 fallos en <15s sacan al primario y nginx usa el backup.
upstream kb_backend {
    server 192.168.0.45:8084 max_fails=3 fail_timeout=15s;
    server agent-mesh:8084 backup;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://kb_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
        proxy_connect_timeout 5s;
    }
}